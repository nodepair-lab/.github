    <text x="40" y="240" fill="#7ee2a8">two languages</text><text x="300" y="240" fill="#9fb0c8">&gt;</text><text x="336" y="240" fill="#e6edf7">English and Persian</text>
    <rect x="640" y="222" width="12" height="24" fill="#5ad1ff"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/></rect>
