  <text x="600" y="32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" fill="#9fb0c8">nodepair-lab ~ how-we-work</text>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="23">
    <text x="40" y="92" fill="#5ad1ff">~$ <tspan fill="#e6edf7">cat how-we-work.txt</tspan></text>
